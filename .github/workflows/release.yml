name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/myaitools/__init__.py | head -n1)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "解析到版本：${TAG}"

      - name: 检查标签与 Release 是否已存在
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "标签 ${TAG} 尚不存在，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 从 CHANGELOG 提取发布说明
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '详见 [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)。\n' "${{ github.repository }}" > release-notes.md
          fi
          echo "----- 发布说明 -----"
          cat release-notes.md

      - name: 创建 GitHub Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "MyAITools ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag
